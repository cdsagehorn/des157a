<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Worst Space Mission Ever</title>

    <!-- Normalize CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <header>

        <img src="images/space-planet.png"
            width="180"
            height="120"
            alt="Illustration of a planet in space">

        <section>
            <h1>The Worst <span>Space Mission Ever</span></h1>
            <p>Create your own disastrous space mission!</p>
        </section>

    </header>

    <main>

        <!-- Form View -->
        <section class="form-view">

            <h2>Mission Details</h2>

            <form id="myform">

                <div class="form-fields">

                    <p>
                        <label for="person-name">Person's Name:</label>
                        <input type="text" id="person-name" required>
                    </p>

                    <p>
                        <label for="adjective">Adjective:</label>
                        <input type="text" id="adjective" required>
                    </p>

                    <p>
                        <label for="animal">Animal:</label>
                        <input type="text" id="animal" required>
                    </p>

                    <p>
                        <label for="number">Number (2 or more):</label>
                        <input type="number" id="number" required>
                    </p>

                    <p>
                        <label for="food">Type of Food:</label>
                        <input type="text" id="food" required>
                    </p>

                    <p>
                        <label for="verb">Verb ending in "-ing":</label>
                        <input type="text" id="verb" required>
                    </p>

                    <p>
                        <label for="place">Place:</label>
                        <input type="text" id="place" required>
                    </p>

                    <p>
                        <label for="color">Color:</label>
                        <input type="text" id="color" required>
                    </p>

                    <p>
                        <label for="plural-noun">Plural Noun:</label>
                        <input type="text" id="plural-noun" required>
                    </p>

                    <p>
                        <label for="exclamation">Exclamation:</label>
                        <input type="text" id="exclamation" required>
                    </p>

                </div>

                <input type="submit" value="Create Mission">

            </form>

        </section>

        <!-- Mission Report View -->
        <section class="report-view hidden">

            <h2>Mission Report</h2>

            <p class="report-subtitle">
                The worst space mission ever
            </p>

            <article id="madlib"></article>

            <button type="button" id="play-again">
                Play Again
            </button>

        </section>

    </main>

    <footer>

        <a href="../../index.html" class="menu-link">
            Back to Menu
        </a>

    </footer>

</body>

</html>
