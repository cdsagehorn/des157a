<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiment 1</title>
</head>

<body>

    <h1>Experiment 1</h1>

    <h2>Open the console to see the functionality of the code.</h2>

    <script>
        // This program counts from 1 to 10 and says if each number is small or big.

        // SEQUENCE: Start by printing a message in the console.
        console.log("Starting the number experiment!");

        // LOOP: Count from 1 to 10.
        for (var i = 1; i < 11; i++) {

            // SELECTION: Check if the number is less than 5.
            if (i < 5) {
                console.log(`The number ${i} is small.`);
            } else {
                console.log(`The number ${i} is getting big.`);
            }
        }

        console.log("The experiment is finished!");
    </script>

</body>

</html>
